name: Publish to NuGet

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (Fallback if not a Release)'
        required: true
        default: '1.6.3'
    
jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0'
          
      - name: Get version
        id: get_version
        shell: bash
        run: |
          if [ -n "${{ github.event.release.tag_name }}" ]; then
            SELECTED_VERSION="${{ github.event.release.tag_name }}"
          else
            SELECTED_VERSION="${{ github.event.inputs.version }}"
          fi
          CLEAN_VERSION=$(echo $SELECTED_VERSION | sed 's/^v//')
          echo "VERSION=$CLEAN_VERSION" >> $GITHUB_OUTPUT

      - name: Set version in .csproj
        run: |
          sed -i 's/<Version>.*<\/Version>/<Version>${{ steps.get_version.outputs.VERSION }}<\/Version>/g' **/*.csproj
          
      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore
        
      - name: Pack the project
        run: dotnet pack --configuration Release ./src/ILovePDF/iLovePDF.csproj --output ./nupkg

      - name: Publish to NuGet
        run: dotnet nuget push "./nupkg/*.nupkg" --api-key ${{ secrets.NUGET_TOKEN }} --source https://api.nuget.org/v3/index.json --skip-duplicate
